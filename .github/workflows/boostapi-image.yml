name: BoostAPI Image

on:
  workflow_dispatch:
  push:
    branches:
      - boostapi/**

permissions:
  contents: read
  packages: write

concurrency:
  group: boostapi-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image metadata
        id: metadata
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=0.1.168-boostapi.1" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::9}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.metadata.outputs.image }}:boostapi-v0.1.168-r1
            ${{ steps.metadata.outputs.image }}:boostapi-v0.1.168
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ steps.metadata.outputs.commit }}
            DATE=${{ steps.metadata.outputs.date }}
          cache-from: type=gha,scope=boostapi-v0168
          cache-to: type=gha,mode=max,scope=boostapi-v0168
          provenance: mode=max
          sbom: true
