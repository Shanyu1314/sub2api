name: BoostAPI Release

# 触发方式：
#   1. 推送分支 boostapi/**        → 验证(后端编译+单测、前端类型检查+测试) + 构建镜像，不部署
#   2. 推送 tag boostapi-v*        → 验证 + 构建 + 自动部署生产（例: boostapi-v0.2.18-r1）
#   3. 手动 workflow_dispatch      → 可选择是否部署
on:
  push:
    branches:
      - 'boostapi/**'
    tags:
      - 'boostapi-v*'
  workflow_dispatch:
    inputs:
      deploy:
        description: '构建后部署到生产（false 则只构建镜像）'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: boostapi-release
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/shanyu1314/sub2api

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Backend build and unit tests
        working-directory: backend
        run: |
          go build ./...
          make test-unit
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical tests
        run: make test-frontend

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"                 # 例: boostapi-v0.2.18-r1
            RAW="${TAG#boostapi-v}"                  # 0.2.18-r1
            BASE="${RAW%%-r*}"                       # 0.2.18
            REV="1"; [[ "$RAW" == *-r* ]] && REV="${RAW##*-r}"
            VERSION="${BASE}-boostapi.${REV}"        # 0.2.18-boostapi.1
          else
            TAG="boostapi-${GITHUB_SHA::9}"
            VERSION="$(tr -d '\r\n' < backend/cmd/server/VERSION)-boostapi.${GITHUB_SHA::9}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::9}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=boostapi
          cache-to: type=gha,mode=max,scope=boostapi
          provenance: false
          sbom: false

  deploy:
    needs: build
    if: github.ref_type == 'tag' || inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v6
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 固定服务器主机指纹，不信任首次连接
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User root\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ServerAliveInterval 15\n  ConnectTimeout 30\n' "$DEPLOY_HOST" > ~/.ssh/config
      - name: Deploy
        run: |
          set -euo pipefail
          # 该密钥在服务器上被限制为只能执行 /usr/local/sbin/boostapi-deploy，镜像名作为参数传入
          ssh prod "${{ env.IMAGE_NAME }}:${{ needs.build.outputs.tag }}"
      - name: Public health check
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "${{ vars.PUBLIC_HEALTH_URL }}" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "::error::public health check failed"
          exit 1
